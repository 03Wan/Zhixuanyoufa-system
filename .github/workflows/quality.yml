name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend+/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend+
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/app
          DIRECT_URL: postgresql://user:password@localhost:5432/app
          JWT_SECRET: ci_jwt_secret_for_build_only
          CONFIG_ENCRYPTION_KEY: ci_config_secret_for_build_only
        run: npm run prisma:generate

      - name: Backend lint
        working-directory: backend
        run: npm run lint

      - name: Backend tests
        working-directory: backend
        run: npm test

      - name: Backend build
        working-directory: backend
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/app
          DIRECT_URL: postgresql://user:password@localhost:5432/app
          JWT_SECRET: ci_jwt_secret_for_build_only
          CONFIG_ENCRYPTION_KEY: ci_config_secret_for_build_only
        run: npm run build

      - name: Frontend build
        working-directory: frontend+
        run: npm run build

      - name: Backend audit
        working-directory: backend
        run: npm audit --audit-level=moderate --registry=https://registry.npmjs.org

      - name: Frontend audit
        working-directory: frontend+
        run: npm audit --audit-level=moderate --registry=https://registry.npmjs.org

      - name: Production copy scan
        run: node scripts/scan_forbidden_terms.mjs
